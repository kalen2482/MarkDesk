appId: com.apple.markdesk
productName: MarkDesk
artifactName: "${productName}-${version}-win-x64-setup.${ext}"
copyright: Copyright © 2026 Apple
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - build/icon.ico
  - package.json
win:
  target: nsis
  icon: build/icon.ico
publish:
  provider: github
  owner: kalen2482
  repo: MarkDesk
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
fileAssociations:
  - ext:
      - md
      - markdown
      - mdx
    name: MarkDesk Markdown Document
    role: Editor
    description: Markdown document opened with MarkDesk
